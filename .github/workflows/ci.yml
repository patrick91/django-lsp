name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    name: Rust quality suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Check generated documentation
        run: cargo run --bin render-docs -- --check
      - name: Run tests
        run: cargo test --all-targets

  django:
    name: Django ${{ matrix.django }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        django: ["5.2", "6.0", "6.1"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Django
        run: python -m pip install "Django~=${{ matrix.django }}.0"
      - name: Validate Django fixture
        working-directory: tests/fixtures/django_project
        run: |
          python manage.py check
          python manage.py test
      - name: Run LSP protocol tests
        run: cargo test --test lsp_protocol

  zed-extension:
    name: Zed extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: wasm32-wasip1
      - name: Check formatting
        run: cargo fmt --manifest-path extensions/zed-extension/Cargo.toml -- --check
      - name: Run Clippy
        run: cargo clippy --locked --target wasm32-wasip1 --manifest-path extensions/zed-extension/Cargo.toml -- -D warnings
      - name: Check extension
        run: cargo check --locked --target wasm32-wasip1 --manifest-path extensions/zed-extension/Cargo.toml

  vscode-extension:
    name: VS Code extension
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extensions/vscode-extension
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: extensions/vscode-extension/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Check extension
        run: npm run check
      - name: Package universal development VSIX
        run: npm run package:universal
      - name: Upload universal development VSIX
        uses: actions/upload-artifact@v7
        with:
          name: vscode-extension-universal
          path: extensions/vscode-extension/dist/django-lsp-universal.vsix
          if-no-files-found: error

  website:
    name: Documentation website
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: website/package-lock.json
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: website/uv.lock
      - name: Install Python dependencies
        run: uv sync --locked
      - name: Install frontend dependencies
        run: npm ci
      - name: Check website
        run: npm run check
      - name: Build website
        run: npm run build
      - name: Import FastAPI application
        run: uv run python -c "from app import app; assert app.title == 'django-lsp'"

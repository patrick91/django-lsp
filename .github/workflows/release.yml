name: Release

on:
  pull_request:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  wheels:
    name: Wheel (${{ matrix.platform.target }})
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            manylinux: "2_28"
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            manylinux: "2_28"
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            manylinux: "off"
          - runner: macos-15
            target: aarch64-apple-darwin
            manylinux: "off"
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
            manylinux: "off"

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@1.95.0
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: Check tag matches package versions
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          python -c 'import json, os, tomllib; server = tomllib.load(open("Cargo.toml", "rb"))["package"]["version"]; extension = json.load(open("extensions/vscode-extension/package.json"))["version"]; tag = os.environ["GITHUB_REF_NAME"]; assert tag == f"v{server}" == f"v{extension}", f"tag {tag}, server v{server}, and extension v{extension} must match"'
      - name: Build wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: v1.11.5
          target: ${{ matrix.platform.target }}
          manylinux: ${{ matrix.platform.manylinux }}
          args: --release --locked --compatibility pypi --out dist
      - name: Install and run wheel
        shell: bash
        run: |
          uv tool install --force dist/*.whl
          python -c 'import os, pathlib, subprocess; executable = pathlib.Path(subprocess.check_output(["uv", "tool", "dir", "--bin"], text=True).strip()) / ("django-lsp.exe" if os.name == "nt" else "django-lsp"); subprocess.run([executable, "--version"], check=True)'
      - name: Prepare and run extension binary
        env:
          TARGET: ${{ matrix.platform.target }}
        shell: bash
        run: |
          python -c 'import os, pathlib, shutil, subprocess; suffix = ".exe" if os.name == "nt" else ""; target = os.environ["TARGET"]; source = pathlib.Path(subprocess.check_output(["uv", "tool", "dir", "--bin"], text=True).strip()) / f"django-lsp{suffix}"; destination = pathlib.Path("dist") / f"django-lsp-{target}{suffix}"; shutil.copy2(source, destination); subprocess.run([destination.resolve(), "--version"], check=True)'
      - name: Upload wheel
        uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.platform.target }}
          path: dist/*.whl
          if-no-files-found: error
      - name: Upload extension binary
        uses: actions/upload-artifact@v7
        with:
          name: binaries-${{ matrix.platform.target }}
          path: dist/django-lsp-${{ matrix.platform.target }}*
          if-no-files-found: error

  vscode-extension:
    name: VS Code packages
    needs: wheels
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: extensions/vscode-extension/package-lock.json
      - name: Download extension binaries
        uses: actions/download-artifact@v8
        with:
          pattern: binaries-*
          path: vscode-binaries
          merge-multiple: true
      - name: Install dependencies
        working-directory: extensions/vscode-extension
        run: npm ci
      - name: Run extension tests
        working-directory: extensions/vscode-extension
        run: npm test
      - name: Package platform-specific VSIX files
        working-directory: extensions/vscode-extension
        run: |
          npm run package:platform -- darwin-arm64 ../../vscode-binaries/django-lsp-aarch64-apple-darwin dist
          npm run package:platform -- darwin-x64 ../../vscode-binaries/django-lsp-x86_64-apple-darwin dist
          npm run package:platform -- linux-arm64 ../../vscode-binaries/django-lsp-aarch64-unknown-linux-gnu dist
          npm run package:platform -- linux-x64 ../../vscode-binaries/django-lsp-x86_64-unknown-linux-gnu dist
          npm run package:platform -- win32-x64 ../../vscode-binaries/django-lsp-x86_64-pc-windows-msvc.exe dist
      - name: Upload platform-specific VSIX files
        uses: actions/upload-artifact@v7
        with:
          name: vscode-extensions
          path: extensions/vscode-extension/dist/*.vsix
          if-no-files-found: error

  vscode-marketplace:
    name: Publish VS Code Marketplace
    if: startsWith(github.ref, 'refs/tags/v')
    needs: vscode-extension
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: extensions/vscode-extension/package-lock.json
      - name: Download VS Code extensions
        uses: actions/download-artifact@v8
        with:
          name: vscode-extensions
          path: extensions/vscode-extension/dist
      - name: Install publishing tools
        working-directory: extensions/vscode-extension
        run: npm ci
      - name: Publish platform-specific extensions
        working-directory: extensions/vscode-extension
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npm exec -- vsce publish --skip-duplicate --packagePath dist/*.vsix

  github-release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [wheels, vscode-extension]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - name: Download extension binaries
        uses: actions/download-artifact@v8
        with:
          pattern: binaries-*
          path: dist
          merge-multiple: true
      - name: Download VS Code extensions
        uses: actions/download-artifact@v8
        with:
          name: vscode-extensions
          path: dist
      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* --generate-notes --verify-tag
          fi

  pypi:
    name: Publish to PyPI
    if: startsWith(github.ref, 'refs/tags/v')
    needs: wheels
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - name: Publish wheels
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist

[package]
name = "django-lsp"
version = "0.1.1"
edition = "2024"
rust-version = "1.95"
description = "A language server for Django ORM query completions"
readme = "README.md"
license = "MIT"
repository = "https://github.com/patrick91/django-lsp"
homepage = "https://github.com/patrick91/django-lsp"
keywords = ["django", "lsp", "language-server", "autocomplete"]
categories = ["development-tools"]
publish = false

[dependencies]
globset = "0.4.20"
ignore = "0.4.33"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["io-std", "macros", "rt-multi-thread", "sync"] }
toml = "1.1.4"
tower = { version = "0.5.3", features = ["util"] }
tower-lsp-server = "0.23.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }

ruff_python_ast = { git = "https://github.com/astral-sh/ruff.git", tag = "0.16.0" }
ruff_python_parser = { git = "https://github.com/astral-sh/ruff.git", tag = "0.16.0" }
ruff_text_size = { git = "https://github.com/astral-sh/ruff.git", tag = "0.16.0" }

[dev-dependencies]
tempfile = "3.27.0"

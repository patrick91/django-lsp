[package]
name = "django-lsp"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"

[dependencies]
globset = "0.4.20"
ignore = "0.4.33"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["io-std", "macros", "rt-multi-thread", "sync"] }
toml = "1.1.4"
tower-lsp-server = "0.23.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }

ruff_python_ast = { git = "https://github.com/astral-sh/ruff.git", tag = "0.16.0" }
ruff_python_parser = { git = "https://github.com/astral-sh/ruff.git", tag = "0.16.0" }
ruff_text_size = { git = "https://github.com/astral-sh/ruff.git", tag = "0.16.0" }

[dev-dependencies]
serde_json = "1.0.151"
tempfile = "3.27.0"
tower = { version = "0.5.3", features = ["util"] }
